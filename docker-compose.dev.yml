services:
  rqbit:
    image: ikatson/rqbit:latest
    command: server start /home/rqbit/downloads
    ports:
      - "3030:3030"
    volumes:
      - rqbit-db:/home/rqbit/db
      - rqbit-cache:/home/rqbit/cache
      - rqbit-downloads:/home/rqbit/downloads

  web:
    build:
      context: .
      dockerfile: Dockerfile.check
    command: npm run dev -- --host 0.0.0.0
    environment:
      RQBIT_PROXY_TARGET: http://rqbit:3030
    ports:
      - "1420:1420"
    depends_on:
      - rqbit

volumes:
  rqbit-db:
  rqbit-cache:
  rqbit-downloads:
