[package]
name = "torrentdock"
version = "0.1.0"
description = "A legitimate torrent and magnet workflow desktop client"
authors = ["TorrentDock contributors"]
edition = "2021"

[lib]
name = "torrentdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
