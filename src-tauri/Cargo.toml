[package]
name = "torrentdock"
version = "0.1.0"
description = "A legitimate torrent and magnet workflow desktop client"
authors = ["TorrentDock contributors"]
edition = "2021"

[lib]
name = "torrentdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scraper = "0.24"
url = "2"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSView"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["objc2-core-foundation"] }
